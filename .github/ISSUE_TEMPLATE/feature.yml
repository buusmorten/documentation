name: Feature request
description: Suggest a product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options: [Remote.Me, CubeHarbor, DTRAPP / Den Tunge Radio, Lattice-VM]
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Explain the problem and who benefits, without sensitive organization details.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behavior
    validations:
      required: true
